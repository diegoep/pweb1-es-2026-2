<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição — Semana de Tecnologia IFPB 2026</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #186fad;
        }
        fieldset {
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
        }
        legend {
            font-weight: bold;
            color: #186fad;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        video, iframe {
            max-width: 100%;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button[type="submit"] {
            background: #186fad;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Semana de Tecnologia IFPB 2026</h1>
    <p>De 14 a 18 de setembro, no Campus João Pessoa. Inscreva-se abaixo!</p>

    <!-- Vídeo de divulgação com fallback -->
    <figure>
        <video controls width="560" preload="metadata">
            <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
                    type="video/mp4">
            Seu navegador não suporta vídeo HTML5.
            <a href="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">
                Baixe o vídeo de divulgação</a>.
        </video>
        <figcaption>Chamada da Semana de Tecnologia (vídeo de exemplo, CC0).</figcaption>
    </figure>

    <form action="#" method="post" enctype="multipart/form-data" autocomplete="on">

        <fieldset>
            <legend>Dados pessoais</legend>

            <label for="nome">Nome completo *</label>
            <input type="text" id="nome" name="nome"
                   autocomplete="name" minlength="3" required>

            <label for="email">Email *</label>
            <input type="email" id="email" name="email"
                   autocomplete="email" required>

            <label for="telefone">Telefone (só números, com DDD) *</label>
            <input type="tel" id="telefone" name="telefone"
                   autocomplete="tel" inputmode="numeric"
                   pattern="[0-9]{10,11}" placeholder="83999998888" required>

            <label for="nascimento">Data de nascimento</label>
            <input type="date" id="nascimento" name="nascimento">

            <label for="uf">Estado</label>
            <select id="uf" name="uf">
                <option value="PB" selected>Paraíba</option>
                <option value="PE">Pernambuco</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="CE">Ceará</option>
                <option value="AL">Alagoas</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Ingresso</legend>

            <label>
                <input type="radio" name="ingresso" value="estudante" checked>
                Estudante (gratuito)
            </label>
            <label>
                <input type="radio" name="ingresso" value="professor">
                Professor
            </label>
            <label>
                <input type="radio" name="ingresso" value="comunidade">
                Comunidade externa
            </label>

            <label for="quantidade">Quantidade de ingressos *</label>
            <input type="number" id="quantidade" name="quantidade"
                   min="1" max="5" value="1" required>
        </fieldset>

        <fieldset>
            <legend>Interesses</legend>

            <label>
                <input type="checkbox" name="interesse" value="web">
                Desenvolvimento Web
            </label>
            <label>
                <input type="checkbox" name="interesse" value="ia">
                Inteligência Artificial
            </label>
            <label>
                <input type="checkbox" name="interesse" value="games">
                Desenvolvimento de Jogos
            </label>
            <label>
                <input type="checkbox" name="interesse" value="seguranca">
                Segurança da Informação
            </label>
        </fieldset>

        <label for="origem">Como conheceu o evento?</label>
        <input type="text" id="origem" name="origem" list="origens">
        <datalist id="origens">
            <option value="Instagram">
            <option value="Indicação de amigo">
            <option value="Professor">
            <option value="Site do IFPB">
        </datalist>

        <label for="comprovante">Comprovante de matrícula (estudantes)</label>
        <input type="file" id="comprovante" name="comprovante"
               accept=".pdf,image/*">

        <label for="comentarios">Comentários</label>
        <textarea id="comentarios" name="comentarios" rows="4"
                  maxlength="500"
                  placeholder="Alguma necessidade especial? Sugestão de tema?"></textarea>

        <button type="submit">Inscrever-se</button>
        <button type="reset">Limpar</button>
    </form>

</body>
</html>
