<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição — Meu Evento</title>
    <style>
        /* CSS pronto — não precisa mexer aqui */
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #186fad;
        }
        fieldset {
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
        }
        legend {
            font-weight: bold;
            color: #186fad;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        video, iframe {
            max-width: 100%;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button[type="submit"] {
            background: #186fad;
            color: white;
        }
    </style>
</head>
<body>

    <!--
        Prática 03 — Formulário de Inscrição
        Veja o enunciado completo em enunciado.md

        Estrutura sugerida:
        1. <h1> com o nome do evento
        2. Vídeo de divulgação (<video> ou <iframe>)
        3. <form> com fieldsets:
           - Dados pessoais (nome, email, telefone, nascimento)
           - Ingresso (radios de tipo + number de quantidade)
           - Interesses (checkboxes)
        4. textarea de comentários
        5. Botões submit e reset
    -->

</body>
</html>
