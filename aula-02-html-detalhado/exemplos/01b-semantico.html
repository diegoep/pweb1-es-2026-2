<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo: com elementos semânticos</title>
</head>
<body>
    <!--
        Mesmo conteúdo de 01a-div-soup.html, mas usando elementos
        semânticos. Abra os dois no navegador: visualmente são
        parecidos, mas inspecione com o DevTools (F12) e veja como
        a árvore de acessibilidade muda.
    -->
    <header>
        <h1>Meu Blog</h1>
        <nav>
            <ul>
                <li><a href="#post1">Primeiro Post</a></li>
                <li><a href="#post2">Segundo Post</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article id="post1">
            <h2>Primeiro Post</h2>
            <p><time datetime="2026-08-17">17/08/2026</time></p>
            <p>Texto do primeiro post...</p>
        </article>

        <article id="post2">
            <h2>Segundo Post</h2>
            <p><time datetime="2026-08-19">19/08/2026</time></p>
            <p>Texto do segundo post...</p>
        </article>
    </main>

    <aside>
        <h2>Categorias</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
        </ul>
    </aside>

    <footer>
        <p>&copy; 2026 - Meu Blog</p>
    </footer>
</body>
</html>
