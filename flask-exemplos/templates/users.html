<!DOCTYPE html>
<html lang='pt'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Página Inicial</title>
    <style>
        html {
            background-color: #d1d1d1;
        }
    </style>
</head>
<body>
    <h1>Página de Usuários</h1>
    <p>Essa é a página do usuario {{ nome }}</p>
    <h2>Preferências do usuário:</h2>
    <ul>
    {% for p in preferencias %}
        <li>{{p}}</li>
    {% endfor %}
    </ul>
    <p>Tem e-mail válido?
        {% if emailValido %}
        SIM
        {% else %}
        NÃO
        {% endif %}
    </p>

    <ul>
        <li><a href="{{ url_for('index') }}">Voltar para o início</a></li>
    </ul>
</body>
</html>
