{% extends 'base.html' %}

{% block title %}Entrar{% endblock %}

{% block content %}
    <h1 class="mb-4 text-2xl font-bold">Entrar</h1>

    <form method="post" class="flex flex-col gap-3">
        <label>
            <span class="mb-1 block text-sm font-medium">E-mail</span>
            <input type="email" name="email" required class="w-full rounded border border-gray-300 px-3 py-2">
        </label>
        <label>
            <span class="mb-1 block text-sm font-medium">Senha</span>
            <input type="password" name="senha" required class="w-full rounded border border-gray-300 px-3 py-2">
        </label>
        <button class="rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">Entrar</button>
    </form>

    <p class="mt-4 text-sm">Não tem conta? <a href="{{ url_for('auth.cadastro') }}" class="text-blue-600 hover:underline">Cadastre-se</a></p>
{% endblock %}
