{% extends 'base.html' %}

{% block title %}Meus pedidos{% endblock %}

{% block content %}
    <h1 class="mb-4 text-2xl font-bold">Meus pedidos</h1>

    <ul class="divide-y divide-gray-200">
    {% for pedido in pedidos %}
        <li class="flex justify-between py-2">
            <span>{{ pedido.quantidade }}× {{ pedido.produto }}</span>
            <span>R$ {{ pedido.subtotal }}</span>
        </li>
    {% else %}
        <li class="py-2 text-gray-500">Você ainda não fez pedidos.</li>
    {% endfor %}
    </ul>
{% endblock %}
